<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="540" height="210"
     font-family="Linux Libertine, Libertinus Serif, serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- the derived claim -->
  <rect x="200" y="14" width="140" height="86" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="270" y="34" text-anchor="middle" font-style="italic">derivation/summary</text>
  <text x="212" y="54" fill="#444" font-size="11.5">type, created_at, height</text>
  <text x="212" y="70" fill="#444" font-size="11.5">encoding, content_size</text>
  <text x="212" y="86" fill="#444" font-size="11.5">content, edges</text>

  <!-- the two claims it cites -->
  <rect x="14" y="130" width="150" height="52" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="89" y="150" text-anchor="middle" font-style="italic">source/email</text>
  <text x="89" y="169" text-anchor="middle" fill="#444" font-size="11.5">height 0</text>

  <rect x="376" y="130" width="150" height="52" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="451" y="150" text-anchor="middle" font-style="italic">contribution/contributor</text>
  <text x="451" y="169" text-anchor="middle" fill="#444" font-size="11.5">pubkey</text>

  <!-- edges, drawn from the owning claim to what it references -->
  <path d="M 224 100 L 120 128" stroke="#333" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 316 100 L 420 128" stroke="#333" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

  <text x="132" y="112" text-anchor="end" font-size="11.5" font-style="italic">derivation/summary</text>
  <text x="408" y="112" font-size="11.5" font-style="italic">contribution/contributor</text>
</svg>
